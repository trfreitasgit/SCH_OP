<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Ordens Pendentes</title>
</head>
<body>
    <h1>Ordens Pendentes</h1>

    <button id="btnCopiar">Copiar OPs para o SAP</button>

    <table border="1" id="tabelaOrdens">
        <thead>
            <tr>
                <th>OP</th>
                <th>Total de peças</th>
                <th>Data de abertura</th>
                <th>Material</th>
                <th>Situação</th>
                <th>Observação</th>
                <th>Setor</th>
                <th>Prioridade</th>
                <th>Dia analise</th>
            </tr>
        </thead>
        <tbody>
            <!-- as linhas vão ser preenchidas pelo JavaScript -->
        </tbody>
    </table>
<hr>

<h2>Cadastrar Ordens em Massa</h2>

<div>
    <label>Números das OPs (um por linha):</label><br>
    <textarea id="listaOPs" rows="8" cols="20"></textarea>
</div>

<div>
    <label>Total de peças (um por linha, mesma ordem):</label><br>
    <textarea id="listaPecas" rows="8" cols="20"></textarea>
</div>

<div>
    <label>Materiais (um por linha, mesma ordem):</label><br>
    <textarea id="listaMateriais" rows="8" cols="20"></textarea>
</div>

<div>
    <label>Data de abertura:</label>
    <input type="date" id="dataAberturaLote">
</div>

<div>
    <label>Dia de análise:</label>
    <input type="date" id="diaAnaliseLote">
</div>

<div>
    <label>Setor:</label>
    <select id="setorLote">
        <option value="Montagem">Montagem</option>
        <option value="Subconjunto">Subconjunto</option>
        <option value="Celula">Célula</option>
        <option value="BCM">BCM</option>
        <option value="Importada">Importada</option>
        <option value="Usinagem">Usinagem</option>
    </select>
</div>

<div>
    <label>Situação:</label>
    <select id="situacaoLote">
        <option value="Falta Pagar">Falta Pagar</option>
        <option value="Pago">Pago</option>
        <option value="Encerrado">Encerrado</option>
    </select>
</div>

<div>
    <label>Prioridade:</label>
    <select id="prioridadeLote">
        <option value="">Ainda não definida</option>
        <option value="Exportacao">Exportação</option>
        <option value="MWM">MWM</option>
        <option value="KS">KS</option>
        <option value="Marelli">Marelli</option>
        <option value="Pendencia Comercial">Pendência Comercial</option>
        <option value="Linha Pesada">Linha Pesada</option>
        <option value="MRP">MRP</option>
        <option value="Tryout">Tryout</option>
    </select>
</div>

<button id="btnGerarPrevia">Gerar Prévia</button>

<table border="1" id="tabelaPrevia">
    <thead>
        <tr>
            <th>OP</th>
            <th>Total de peças</th>
            <th>Material</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<button id="btnConfirmarLote" style="display:none;">Confirmar e Cadastrar</button>
    <script>
        var ordensCarregadas = []
        function formatarData(dataISO) {
            var partes = dataISO.split('-');
            var ano = partes [0];
            var mes = partes [1];
            var dia = partes [2].substring(0, 2);
            return dia + '/' + mes + '/' + ano;
        }
        

        fetch('http://localhost:3000/ordens/pendentes') //pega a url bruta, sem os dados json
    .then(function(resposta) {
        return resposta.json(); // trata para resposta json
    })
    .then(function(dados) {
        ordensCarregadas = dados; // guarda aqui os dados
        var tabela = document.getElementById('tabelaOrdens'); //guarda uma referência pro elemento table id
        var corpoTabela = tabela.querySelector('tbody'); //pegamos especificamente o tbody da tabela
        var html = '';
        dados.forEach(function(ordem) {
            html += '<tr><td>' + ordem.numero_op + '</td><td>' + ordem.total_pecas + '</td><td>' + formatarData(ordem.data_abertura) + '</td><td>' + ordem.material + '</td><td>' + ordem.situacao + '</td><td>' + (ordem.observacao || '') + '</td><td>' + ordem.setor + '</td><td>' + ordem.prioridade + '</td><td>' + formatarData(ordem.dia_analise) + '</td></tr>';
        });
        corpoTabela.innerHTML = html;
    });

    document.getElementById('btnCopiar').addEventListener('click', function(){
        var texto = '';
        ordensCarregadas.forEach(function(ordem) {
            texto += ordem.numero_op + '\n';
        });
        navigator.clipboard.writeText(texto);
    });
    </script>
</body>
</html>
