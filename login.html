<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>SCHADEK • Sistema Integrado de OPs | Acesso Corporativo</title>
    <link href="/assets/Logo_schadek.png" rel="icon" type="image/png">
    <!-- Fontes Corporativas: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS v3 com Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
                mono: ['JetBrains Mono', 'monospace'],
              },
              colors: {
                schadek: {
                  50: '#fff7ed',
                  100: '#ffedd5',
                  400: '#fb923c',
                  500: '#f97316',
                  600: '#ea580c',
                  700: '#c2410c',
                  glow: 'rgba(249, 115, 22, 0.35)',
                },
                industrial: {
                  950: '#090b0e',
                  900: '#0e1117',
                  850: '#131720',
                  800: '#1b202c',
                  700: '#282f40',
                  600: '#475569'
                }
              },
              boxShadow: {
                'schadek-glow': '0 0 45px -8px rgba(249, 115, 22, 0.22), 0 20px 40px -15px rgba(0, 0, 0, 0.7)',
                'schadek-glow-sm': '0 0 20px -3px rgba(249, 115, 22, 0.35)',
                'inner-glow': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.1)',
              }
            }
          }
        }
      </script>
    <link rel="stylesheet" href="style.css">
    <style>
        .bg-industrial-ambient {
            background-color: #080a0e;
            background-image:
                radial-gradient(circle at 82% 15%, rgba(249, 115, 22, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 18% 85%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(14, 17, 23, 0.95) 0%, rgba(8, 10, 14, 1) 100%);
        }
        html:not(.dark) .bg-industrial-ambient {
            background-color: #f1f5f9;
            background-image:
                radial-gradient(circle at 85% 15%, rgba(249, 115, 22, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 15% 85%, rgba(30, 41, 59, 0.08) 0%, transparent 45%),
                linear-gradient(to bottom, #f8fafc, #e2e8f0);
        }
        .glass-card-dark {
            background: rgba(18, 22, 31, 0.78);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.09);
        }
        html:not(.dark) .glass-card-dark {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.18), 0 0 35px -8px rgba(249, 115, 22, 0.15);
        }
        .input-industrial {
            background: rgba(14, 18, 25, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            color: #f1f5f9 !important;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-industrial::placeholder {
            color: #64748b !important;
        }
        html:not(.dark) .input-industrial {
            background: rgba(248, 250, 252, 0.95) !important;
            border: 1px solid #cbd5e1 !important;
            color: #0f172a !important;
        }
        html:not(.dark) .input-industrial::placeholder {
            color: #64748b !important;
        }
        .input-industrial:focus {
            border-color: #f97316 !important;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25), inset 0 1px 2px rgba(0,0,0,0.4) !important;
            outline: none !important;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.65; }
        }
        .pulse-status { animation: pulse-dot 2.2s infinite ease-in-out; }

        /* Light mode overrides for full fidelity */
        html:not(.dark) .bg-industrial-ambient { color: #0f172a; }
        html:not(.dark) .glass-card-dark h1 { color: #0f172a; }
        html:not(.dark) .glass-card-dark p.text-slate-400 { color: #475569; }
        html:not(.dark) .glass-card-dark label { color: #334155; }
        html:not(.dark) .glass-card-dark .text-slate-300 { color: #334155; }
        html:not(.dark) .input-industrial::placeholder { color: #64748b; }

        html:not(.dark) #themeToggleBtn {
            background: rgba(226, 232, 240, 0.9);
            border-color: #cbd5e1;
            color: #334155;
        }
        html:not(.dark) #themeToggleBtn:hover {
            background: #e2e8f0;
        }
        html:not(.dark) #themeToggleBtn .text-schadek-400 { color: #ea580c; }
        html:not(.dark) #themeToggleBtn .text-slate-400 { color: #64748b; }

        html:not(.dark) .bg-emerald-950\/40 {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
            color: #059669;
        }
        html:not(.dark) .bg-emerald-950\/40 .text-emerald-400 { color: #10b981; }
        html:not(.dark) .border-emerald-500\/30 { border-color: rgba(16, 185, 129, 0.3); }

        html:not(.dark) .bg-slate-900\/40 { background: rgba(226, 232, 240, 0.9); }
        html:not(.dark) .border-slate-700\/50 { border-color: #cbd5e1; }

        html:not(.dark) .bg-slate-800\/80 { background: rgba(226, 232, 240, 0.95); }
        html:not(.dark) .border-slate-700\/70 { border-color: #cbd5e1; }
        html:not(.dark) .bg-slate-900\/80 { background: rgba(226, 232, 240, 0.95); }

        html:not(.dark) .shadow-schadek-glow {
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15), 0 0 35px -8px rgba(249, 115, 22, 0.15);
        }

        html:not(.dark) #togglePasswordBtn { color: #64748b; }
        html:not(.dark) #togglePasswordBtn:hover { color: #334155; }

        html:not(.dark) .text-slate-100 { color: #0f172a; }
        html:not(.dark) .text-slate-400 { color: #475569; }
        html:not(.dark) .text-slate-500 { color: #64748b; }
        html:not(.dark) .text-white { color: #0f172a; }

        html:not(.dark) .bg-slate-700\/60 { background: rgba(148, 163, 184, 0.6); }
        html:not(.dark) .dark\:bg-slate-800\/50 { background: rgba(226, 232, 240, 0.9); }
        html:not(.dark) .hover\:bg-slate-700\/60:hover { background: #cbd5e1; }

        html:not(.dark) .text-schadek-400 { color: #ea580c; }
        html:not(.dark) .hover\:text-schadek-300:hover { color: #fb923c; }
        html:not(.dark) .bg-schadek-500 { background-color: #f97316; }
        html:not(.dark) .bg-schadek-500\/10 { background-color: rgba(249, 115, 22, 0.1); }
        html:not(.dark) .bg-schadek-600 { background-color: #ea580c; }
        html:not(.dark) .bg-schadek-700 { background-color: #c2410c; }
        html:not(.dark) .hover\:from-schadek-600:hover { --tw-gradient-from: #ea580c; }
        html:not(.dark) .hover\:to-schadek-700:hover { --tw-gradient-to: #c2410c; }
        html:not(.dark) .shadow-schadek-glow-sm { box-shadow: 0 0 20px -3px rgba(249, 115, 22, 0.35); }
        html:not(.dark) .hover\:shadow-schadek-glow:hover { box-shadow: 0 0 45px -8px rgba(249, 115, 22, 0.22), 0 20px 40px -15px rgba(0, 0, 0, 0.15); }

        html:not(.dark) .focus\:ring-schadek-500:focus { --tw-ring-color: #f97316; }
        html:not(.dark) .focus\:ring-offset-slate-900:focus { --tw-ring-offset-color: #0f172a; }

        html:not(.dark) .w-4.h-4.rounded.border-slate-700.bg-slate-900\/90.text-schadek-600 {
            border-color: #cbd5e1;
            background: rgba(255, 255, 255, 0.9);
            color: #ea580c;
        }
        html:not(.dark) .focus\:ring-schadek-500:focus { --tw-ring-color: #f97316; }
        html:not(.dark) .focus\:ring-offset-slate-900:focus { --tw-ring-offset-color: #0f172a; }

        html:not(.dark) footer .text-slate-400 { color: #475569; }
        html:not(.dark) footer .text-slate-500 { color: #64748b; }

        html:not(.dark) .shadow-inner-glow {
            box-shadow: inset 0 1px 1px 0 rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-industrial-ambient min-h-screen text-slate-100 flex flex-col justify-between selection:bg-schadek-500 selection:text-white transition-colors duration-300">
<header class="w-full px-6 py-4 flex items-center z-20 justify-end">
    <div class="flex items-center gap-3">
        <button aria-label="Alternar Modo Escuro / Claro" class="flex items-center gap-2 text-xs font-medium px-3.5 py-1.5 rounded-lg border border-slate-700/60 dark:border-slate-700/80 bg-slate-800/40 dark:bg-slate-800/50 hover:bg-slate-700/60 text-slate-300 hover:text-white transition-all shadow-sm backdrop-blur-md" id="themeToggleBtn" type="button">
            <svg class="w-4 h-4 text-schadek-400" fill="none" id="sunIcon" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5" stroke-width="2"></circle>
                <path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-linecap="round" stroke-width="2"></path>
            </svg>
            <svg class="w-4 h-4 text-slate-400 hidden" fill="none" id="moonIcon" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
            <span class="hidden sm:inline" id="themeToggleText">Modo Escuro</span>
        </button>
        <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-emerald-950/40 border border-emerald-500/30 text-emerald-400 text-xs font-mono">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
            </svg>
            <span>API Online</span>
        </div>
    </div>
</header>
<main class="w-full flex-grow flex items-center justify-center p-4 sm:p-6 z-10">
    <div class="w-full max-w-[450px]">
        <section class="glass-card-dark rounded-2xl p-7 sm:p-8 shadow-schadek-glow relative overflow-hidden transition-all duration-300">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-schadek-500 to-transparent opacity-85"></div>
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-schadek-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="text-center mb-6">
                <div class="flex justify-center mb-4">
                    <div class="p-1 rounded-xl bg-slate-900/40 border border-slate-700/50 shadow-inner-glow inline-block">
                        <img alt="SCHADEK Automotive Logo" class="h-14 sm:h-16 w-auto object-contain rounded-lg shadow-sm" src="assets/Logo_schadek.png">
                    </div>
                </div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white drop-shadow-sm">Sistema Integrado de OPs</h1>
                <p class="text-xs sm:text-sm text-slate-400 mt-1">Controle de Produção • Acesso Corporativo Restrito</p>
                <div class="mt-3.5 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/80 dark:bg-slate-900/80 border border-slate-700/70 text-[11px] text-slate-300 font-mono">
                    <span class="w-1.5 h-1.5 rounded-full bg-schadek-500"></span>
                    Acesso ao sistema de ordens ALMOX
                </div>
            </div>
            <form class="space-y-4" id="industrialLoginForm">
                <div data-purpose="user-identifier-group">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 font-mono" for="userIdentifier">
                        Matrícula / E-mail Corporativo
                    </label>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7 7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </div>
                        <input autocomplete="username" class="input-industrial w-full pl-10 pr-4 py-2.5 rounded-xl text-sm text-slate-100 placeholder-slate-500" id="userIdentifier" placeholder="Digite seu e-mail corporativo" required type="text">
                    </div>
                </div>
                <div data-purpose="password-group">
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider font-mono" for="userPassword">
                            Senha de Acesso
                        </label>
                        <a class="text-xs text-schadek-400 hover:text-schadek-300 hover:underline transition-colors font-medium" href="#" id="forgotPassword">
                            Esqueceu a senha?
                        </a>
                    </div>
                    <div class="relative rounded-xl shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                            </svg>
                        </div>
                        <input autocomplete="current-password" class="input-industrial w-full pl-10 pr-20 py-2.5 rounded-xl text-sm text-slate-100 placeholder-slate-500" id="userPassword" placeholder="••••••••••••" required type="password">
                        <button aria-label="Alternar visualização da senha" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-xs font-mono font-medium text-slate-400 hover:text-slate-200 transition-colors" id="togglePasswordBtn" type="button">
                            <span id="togglePasswordLabel">Mostrar</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input class="w-4 h-4 rounded border-slate-700 bg-slate-900/90 text-schadek-600 focus:ring-schadek-500 focus:ring-offset-slate-900" id="rememberTerminal" type="checkbox">
                        <span class="text-xs text-slate-300">Manter sessão conectada neste terminal</span>
                    </label>
                </div>
                <div class="hidden p-3 rounded-lg text-xs font-mono transition-all" id="loginFeedback"></div>
                <div class="pt-2">
                    <button class="w-full relative group overflow-hidden rounded-xl py-3 px-4 bg-gradient-to-r from-schadek-500 via-schadek-600 to-amber-600 hover:from-schadek-600 hover:to-schadek-700 text-white font-semibold text-sm shadow-schadek-glow-sm hover:shadow-schadek-glow transition-all duration-200 flex items-center justify-center gap-2" id="submitLoginBtn" type="submit">
                        <span class="tracking-wide">Entrar no Sistema</span>
                        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                    </button>
                </div>
            </form>
        </section>
        <footer class="mt-4 text-center space-y-1">
            <div class="flex items-center justify-center gap-3 text-[11px] font-mono text-slate-400"><span>Versão 4.9.0-PROD</span></div>
                <p class="text-[10px] text-slate-500">Desenvolvido por Tiago Freitas</p>
        </footer>
    </div>
</main>
<!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="login.js"></script>
</body>
</html>
