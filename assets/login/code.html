<!-- Interatividade de Senha, Validação e Modo Escuro/Claro -->
<script data-purpose="auth-and-theme-logic">
    // Referências aos elementos do DOM
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const togglePasswordLabel = document.getElementById('togglePasswordLabel');
    const userPasswordInput = document.getElementById('userPassword');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeToggleText = document.getElementById('themeToggleText');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    const loginFeedback = document.getElementById('loginFeedback');
    const submitBtn = document.getElementById('submitLoginBtn');

    // 1. Alternador de Visibilidade da Senha
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = userPasswordInput.getAttribute('type') === 'password';
      userPasswordInput.setAttribute('type', isPassword ? 'text' : 'password');
      togglePasswordLabel.textContent = isPassword ? 'Ocultar' : 'Mostrar';
    });

    // 2. Alternador de Tema Dark / Light
    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      if (isDark) {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
        themeToggleText.textContent = 'Modo Escuro';
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
        themeToggleText.textContent = 'Modo Claro';
      }
    });

    // 3. Simulação de Login Corporativo com Validação Visual
    function handleIndustrialLogin() {
      const identifier = document.getElementById('userIdentifier').value.trim();
      const password = userPasswordInput.value.trim();
      const env = document.getElementById('serverEnvironment').value;

      if (!identifier || !password) {
        showFeedback('Por favor, informe a matrícula e a senha de rede.', 'error');
        return;
      }

      // Efeito de carregamento seguro
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75', 'cursor-wait');
      submitBtn.innerHTML = `
        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Validando credenciais LDAP/PostgreSQL...
      `;

      setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75', 'cursor-wait');
        submitBtn.innerHTML = `
          <span class="tracking-wide">Entrar no Sistema</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
          </svg>
        `;

        showFeedback(`Autenticado com sucesso! Carregando terminal PCP [${env.toUpperCase()}]...`, 'success');
      }, 1200);
    }

    // 4. Feedback de SSO
    function handleSsoLogin() {
      showFeedback('Iniciando handshake com Active Directory Schadek (Kerberos/SAML)...', 'info');
    }

    // Utilitário de exibição de alertas visuais no card
    function showFeedback(message, type) {
      loginFeedback.classList.remove('hidden', 'bg-red-950/60', 'text-red-300', 'border-red-600/40', 'bg-emerald-950/60', 'text-emerald-300', 'border-emerald-600/40', 'bg-sky-950/60', 'text-sky-300', 'border-sky-600/40');
      loginFeedback.classList.add('border');

      if (type === 'error') {
        loginFeedback.classList.add('bg-red-950/60', 'text-red-300', 'border-red-600/40');
      } else if (type === 'success') {
        loginFeedback.classList.add('bg-emerald-950/60', 'text-emerald-300', 'border-emerald-600/40');
      } else {
        loginFeedback.classList.add('bg-sky-950/60', 'text-sky-300', 'border-sky-600/40');
      }

      loginFeedback.textContent = message;
    }
  </script>
<!-- END: ClientLogicScripts -->
